<style>
:root{--bg:#f4f6fc;--card:#fff;--tx:#12204a;--mu:#5b6785;--ac:#2446d6;--ac2:#e6ebff;--bd:#dfe5f3;--g:#16a34a;--y:#c26a00;--r:#d92d2d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1426;--card:#172038;--tx:#e8ecf8;--mu:#9aa6c8;--ac:#7f95ff;--ac2:#232d52;--bd:#2a3558;--g:#3ecf76;--y:#f0a030;--r:#ff6b6b}}
:root[data-theme="dark"]{--bg:#0e1426;--card:#172038;--tx:#e8ecf8;--mu:#9aa6c8;--ac:#7f95ff;--ac2:#232d52;--bd:#2a3558;--g:#3ecf76;--y:#f0a030;--r:#ff6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;flex:none}
aside .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin-bottom:14px}
aside img{width:42px;height:42px;border-radius:10px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:600}
#nav button:hover{background:var(--ac2)}
#nav button.on{background:var(--ac);color:#fff}
#nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tag{font-size:12px;color:var(--mu);margin-top:14px}
main{flex:1;min-width:0;padding:24px;max-width:1100px}
h1{margin:0 0 4px;font-size:26px}h2{font-size:18px;margin:0 0 10px}h3{margin:0 0 6px;font-size:15px}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0}.big{font-size:26px;font-weight:800}.lbl{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.demo{background:var(--ac2);border:1px dashed var(--ac);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--ac2);color:var(--ac)}.btn.sm{padding:4px 9px;font-size:13px}
.err{color:var(--r);font-size:14px;min-height:20px;margin-top:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-size:12px}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ac2)}
.r{color:var(--r)}.y{color:var(--y)}.g{color:var(--g)}
.bar{height:10px;background:var(--ac2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.brow{display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin:7px 0;font-size:14px}
.item{border-left:5px solid var(--bd);padding:8px 12px;margin-bottom:10px;background:var(--bg);border-radius:0 10px 10px 0}
.item.r{border-color:var(--r)}.item.y{border-color:var(--y)}.item.g{border-color:var(--g)}
.item small{color:var(--mu);display:block}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}

<script>
// ---------- Storage (browser localStorage, like the CSV files in the Streamlit version) ----------
const KEY='studypilot_v1', $=s=>document.querySelector(s);
const PAGES=[['dash','🏠 Dashboard'],['marks','📊 Marks Analysis'],['assign','📝 Assignment Manager'],['prio','🎯 Smart Priorities'],['plan','📅 Study Planner'],['prog','📈 Progress Tracking'],['about','ℹ️ About Project']];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return fmt(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function demoData(){return{demo:true,done:{},profile:{name:'Demo Student',course:'BCA Data Science & AI',sem:'1st Semester',roll:'DEMO-001'},
 marks:[['Python','Test 1',42,50,-40],['Python','Test 2',44,50,-12],['DBMS','Test 1',40,50,-38],['DBMS','Test 2',42,50,-10],
  ['C Programming','Test 1',30,50,-36],['C Programming','Test 2',33.5,50,-9],['Statistics','Test 1',26,50,-35],['Statistics','Test 2',30.5,50,-8]]
  .map(m=>({subject:m[0],exam:m[1],obt:m[2],max:m[3],date:addDays(m[4])})),
 assigns:[['C Programming','C Lab Assignment','Pointers and arrays lab',-5,1,'High','Pending'],['DBMS','DBMS SQL Assignment','Joins and subqueries',-3,4,'Medium','In Progress'],
  ['Python','Python Mini Project','Student record manager',-2,12,'Low','Pending'],['Statistics','Statistics Worksheet','Mean, median, mode',-8,-2,'Medium','Completed']]
  .map((a,i)=>({id:i+1,subject:a[0],title:a[1],desc:a[2],assigned:addDays(a[3]),deadline:addDays(a[4]),priority:a[5],status:a[6]}))}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.marks)return s}catch(e){}return demoData()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),page='dash',lineSub=null,F={subject:'All',status:'All',priority:'All',urgency:'All'};

// ---------- Core calculations ----------
const pct=m=>m.obt/m.max*100;
const byDate=(a,b)=>a.date<b.date?-1:1;
// Subject classification: 80+ Strong, 60-79 Needs Attention, below 60 Focus Required
function cls(p){return p>=80?['🟢 Strong','g']:p>=60?['🟡 Needs Attention','y']:['🔴 Focus Required','r']}
function subAvg(){const t={};S.marks.forEach(m=>{(t[m.subject]=t[m.subject]||[]).push(pct(m))});
 const o={};for(const k in t)o[k]=t[k].reduce((a,b)=>a+b,0)/t[k].length;return o}
const overall=()=>{const v=Object.values(subAvg());return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function daysLeft(dl){return Math.round((new Date(dl+'T00:00')-new Date(today()+'T00:00'))/864e5)}
// Deadline rules: overdue/today = URGENT, 1-2 days = HIGH, 3-5 = MEDIUM, more = LOW
function urg(a){if(a.status==='Completed')return['✅ Done','g','DONE'];const d=daysLeft(a.deadline);
 if(d<0)return['🔴 URGENT (overdue)','r','URGENT'];if(d===0)return['🔴 URGENT (due today)','r','URGENT'];
 if(d<=2)return['🔴 HIGH','r','HIGH'];if(d<=5)return['🟡 MEDIUM','y','MEDIUM'];return['🟢 LOW','g','LOW']}
function dtxt(a){const d=daysLeft(a.deadline);return d<0?-d+' day(s) overdue':d===0?'Due today':d===1?'1 day':d+' days'}

// ---------- Smart Priority Engine (rule-based scoring, no AI/ML) ----------
function prios(){const items=[],avg=subAvg();
 for(const s in avg){const p=avg[s];let sc,why,act,min,l;
  if(p<60){sc=40;why='Low current performance (+40)';act='Revise weak topics';min=45;l='r'}
  else if(p<80){sc=15;why='Revision recommended (+15)';act='Revise key topics';min=30;l='y'}
  else{sc=5;why='Current performance is strong (+5)';act='Maintain performance';min=20;l='g'}
  items.push({key:'S:'+s,name:s,sc,why,act,min,l,kind:'Subject',p})}
 S.assigns.filter(a=>a.status!=='Completed').forEach(a=>{const d=daysLeft(a.deadline);let sc=0,w=[];
  if(d<=0){sc+=50;w.push('Due today/overdue +50')}else if(d<=2){sc+=40;w.push('Due within 2 days +40')}else if(d<=5){sc+=20;w.push('Due within 5 days +20')}
  if(a.priority==='High'){sc+=20;w.push('High priority +20')}else if(a.priority==='Medium'){sc+=10;w.push('Medium priority +10')}
  if(a.status==='Pending'){sc+=15;w.push('Pending +15')}else{sc+=10;w.push('In progress +10')}
  items.push({key:'A:'+a.id,name:a.subject+' — '+a.title,sc,why:w.join(', '),act:'Complete assignment ('+dtxt(a)+')',min:30,l:sc>=60?'r':sc>=30?'y':'g',kind:'Assignment'})});
 return items.sort((a,b)=>b.sc-a.sc)}
const dot=l=>l==='r'?'🔴':l==='y'?'🟡':'🟢';
const prioItem=(x,i,mins)=>`<div class="item ${x.l}"><b>${i+1}. ${dot(x.l)} ${esc(x.name)}</b> <span class="pill">score ${x.sc}</span><small>Reason: ${esc(x.why)}</small><small>Suggested ${x.kind==='Subject'&&x.p>=80?'action':'action'}: ${esc(x.act)}${mins?' · '+x.min+' min':''}</small></div>`;

// ---------- Pages ----------
const V={};
V.dash=()=>{const avg=subAvg(),subs=Object.keys(avg),A=S.assigns,open=A.filter(a=>a.status!=='Completed');
 const hi=subs.sort((a,b)=>avg[b]-avg[a]),best=hi[0],worst=hi[hi.length-1];
 const urgent=open.filter(a=>daysLeft(a.deadline)<=2).length,pr=prios().slice(0,3),p=S.profile;
 const card=(l,v,c)=>`<div class="card"><div class="lbl">${l}</div><div class="big ${c||''}">${v}</div></div>`;
 return `<h1>Welcome${p.name?', '+esc(p.name):''} 👋</h1><p class="sub">Your marks and deadlines in one place.</p>
 <div class="grid">${card('Overall Average',subs.length?overall().toFixed(2)+'%':'—')}${card('Subjects',subs.length)}${card('Pending Assignments',open.length)}${card('Completed',A.length-open.length,'g')}${card('Urgent (due in 2 days or less)',urgent,urgent?'r':'')}
 ${card('Strongest Subject',best?esc(best)+' — '+avg[best].toFixed(0)+'%':'—','g')}${card('Focus Subject',worst?esc(worst)+' — '+avg[worst].toFixed(0)+'%':'—',worst&&avg[worst]<60?'r':'y')}</div>
 <div class="two"><div class="card"><h2>🎯 Today's Focus</h2>${pr.length?pr.map((x,i)=>prioItem(x,i,false)).join(''):'<p class="lbl">Add marks or assignments to get your focus list.</p>'}</div>
 <div class="card"><h2>👤 Student Profile</h2><div class="row" style="grid-template-columns:1fr 1fr">
 ${[['name','Name'],['course','Course'],['sem','Semester'],['roll','Roll Number']].map(f=>`<div><label>${f[1]}</label><input value="${esc(p[f[0]]||'')}" onchange="S.profile.${f[0]}=this.value.trim();save()"></div>`).join('')}</div>
 <p class="lbl">Edits save automatically in this browser.</p></div></div>`};

function bars(avg){return Object.keys(avg).map(s=>{const c=cls(avg[s]);return `<div class="brow"><span>${esc(s)}</span><div class="bar"><i style="width:${avg[s]}%;background:var(--${c[1]})"></i></div><b>${avg[s].toFixed(0)}%</b></div>`}).join('')}
function donut(avg){const c=[0,0,0];Object.values(avg).forEach(p=>c[p>=80?0:p>=60?1:2]++);const t=c[0]+c[1]+c[2];if(!t)return'';
 const col=['--g','--y','--r'],nm=['Strong','Needs Attention','Focus Required'];let acc=0;
 const arcs=c.map((n,i)=>{const L=n/t*100,s=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(${col[i]})" stroke-width="5" stroke-dasharray="${L} ${100-L}" stroke-dashoffset="${25-acc}"/>`;acc+=L;return s}).join('');
 return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 36 36" width="150">${arcs}<text x="18" y="20" text-anchor="middle" font-size="7" font-weight="700" fill="var(--tx)">${t}</text></svg><div>${nm.map((n,i)=>`<div>${['🟢','🟡','🔴'][i]} ${n}: <b>${c[i]}</b></div>`).join('')}</div></div>`}
function line(sub){const pts=S.marks.filter(m=>m.subject===sub).sort(byDate).map(m=>({p:pct(m),e:m.exam}));if(!pts.length)return'';
 const W=400,H=190,x=i=>pts.length===1?W/2:35+i*(W-60)/(pts.length-1),y=p=>H-35-p*(H-60)/100;
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">`+[0,50,100].map(g=>`<line x1="30" x2="${W-10}" y1="${y(g)}" y2="${y(g)}" stroke="var(--bd)"/><text x="2" y="${y(g)+4}" font-size="10" fill="var(--mu)">${g}</text>`).join('')
 +`<polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pts.map((q,i)=>x(i)+','+y(q.p)).join(' ')}"/>`
 +pts.map((q,i)=>`<circle cx="${x(i)}" cy="${y(q.p)}" r="4.5" fill="var(--ac)"/><text x="${x(i)}" y="${y(q.p)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tx)">${q.p.toFixed(0)}%</text><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--mu)">${esc(q.e)}</text>`).join('')+'</svg>'}
V.marks=()=>{const avg=subAvg(),subs=Object.keys(avg);if(!lineSub||!avg[lineSub])lineSub=subs[0];
 const rows=S.marks.map((m,i)=>[m,i]).sort((a,b)=>byDate(b[0],a[0])).map(([m,i])=>`<tr><td>${esc(m.subject)}</td><td>${esc(m.exam)}</td><td>${m.obt}</td><td>${m.max}</td><td>${pct(m).toFixed(1)}%</td><td>${m.date}</td><td><button class="btn alt sm" onclick="delMark(${i})">Delete</button></td></tr>`).join('');
 const ranked=subs.sort((a,b)=>avg[b]-avg[a]);
 return `<h1>📊 Marks Analysis</h1><p class="sub">Add test scores — percentages and categories are calculated for you.</p>
 <div class="card"><h2>Add marks</h2><div class="row"><div><label>Subject</label><input id="m_s" list="subl" placeholder="e.g. Python"><datalist id="subl">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>
 <div><label>Test / Exam</label><input id="m_e" placeholder="e.g. Test 3"></div><div><label>Marks obtained</label><input id="m_o" type="number" step="0.5" min="0"></div>
 <div><label>Maximum marks</label><input id="m_x" type="number" min="1" value="50"></div><div><label>Date</label><input id="m_d" type="date" value="${today()}"></div><button class="btn" onclick="addMark()">Add marks</button></div><div class="err" id="err"></div></div>
 ${subs.length?`<div class="grid"><div class="card"><div class="lbl">Overall average</div><div class="big">${overall().toFixed(2)}%</div></div><div class="card"><div class="lbl">Highest</div><div class="big g">${esc(ranked[0])}</div></div><div class="card"><div class="lbl">Lowest</div><div class="big r">${esc(ranked[ranked.length-1])}</div></div></div>
 <div class="two"><div class="card"><h2>Subject average</h2>${bars(avg)}</div><div class="card"><h2>Subject categories</h2>${donut(avg)}<p class="lbl">80–100 Strong · 60–79 Needs Attention · below 60 Focus Required</p></div></div>
 <div class="card"><div class="top"><h2>Performance over time</h2><select style="width:auto" onchange="lineSub=this.value;render()">${subs.sort().map(s=>`<option ${s===lineSub?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${line(lineSub)}</div>
 <div class="card"><h2>All marks</h2><div class="scroll"><table><tr><th>Subject</th><th>Exam</th><th>Obtained</th><th>Maximum</th><th>Percentage</th><th>Date</th><th></th></tr>${rows}</table></div></div>`:'<div class="card">No marks yet. Add your first test score above.</div>'}`};
function addMark(){const s=$('#m_s').value.trim(),e=$('#m_e').value.trim(),o=parseFloat($('#m_o').value),x=parseFloat($('#m_x').value),d=$('#m_d').value,er=$('#err');
 if(!s)return er.textContent='Please enter a subject name.';if(!e)return er.textContent='Please enter the test or exam name.';
 if(isNaN(o)||isNaN(x))return er.textContent='Marks must be numbers.';if(o<0)return er.textContent='Marks cannot be negative.';
 if(x<=0)return er.textContent='Maximum marks must be greater than 0.';if(o>x)return er.textContent='Marks obtained cannot be more than the maximum marks.';
 if(!d)return er.textContent='Please choose a valid date.';
 S.marks.push({subject:s,exam:e,obt:o,max:x,date:d});save();render()}
function delMark(i){S.marks.splice(i,1);save();render()}

V.assign=()=>{const subs=[...new Set([...S.marks.map(m=>m.subject),...S.assigns.map(a=>a.subject)])].sort();
 const sel=(id,arr)=>`<select id="${id}">${arr.map(o=>`<option>${o}</option>`).join('')}</select>`;
 const fsel=(k,arr)=>`<div><label>${k[0].toUpperCase()+k.slice(1)}</label><select onchange="F.${k}=this.value;render()">${['All',...arr].map(o=>`<option ${F[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
 const list=S.assigns.filter(a=>(F.subject==='All'||a.subject===F.subject)&&(F.status==='All'||a.status===F.status)&&(F.priority==='All'||a.priority===F.priority)&&(F.urgency==='All'||urg(a)[2]===F.urgency)).sort((a,b)=>a.deadline<b.deadline?-1:1);
 const rows=list.map(a=>{const u=urg(a);return `<tr><td><b>${esc(a.title)}</b><br><span class="lbl">${esc(a.desc||'')}</span></td><td>${esc(a.subject)}</td><td>${a.deadline}</td><td>${a.status==='Completed'?'—':dtxt(a)}</td>
 <td><select style="width:auto" onchange="setStatus(${a.id},this.value)">${['Pending','In Progress','Completed'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></td><td>${a.priority}</td><td class="${u[1]}"><b>${u[0]}</b></td><td><button class="btn alt sm" onclick="delAssign(${a.id})">Delete</button></td></tr>`}).join('');
 return `<h1>📝 Assignment Manager</h1><p class="sub">Urgency is worked out automatically from the deadline.</p>
 <div class="card"><h2>Add assignment</h2><div class="row"><div><label>Subject</label><input id="a_s" list="asl"><datalist id="asl">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div><div><label>Title</label><input id="a_t"></div>
 <div><label>Description</label><input id="a_d"></div><div><label>Assigned date</label><input id="a_a" type="date" value="${today()}"></div><div><label>Deadline</label><input id="a_l" type="date" value="${addDays(1)}"></div>
 <div><label>Priority</label>${sel('a_p',['Low','Medium','High'])}</div><div><label>Status</label>${sel('a_st',['Pending','In Progress','Completed'])}</div><button class="btn" onclick="addAssign()">Add assignment</button></div><div class="err" id="err"></div></div>
 <div class="card"><h2>Filters</h2><div class="row">${fsel('subject',subs)}${fsel('status',['Pending','In Progress','Completed'])}${fsel('priority',['Low','Medium','High'])}${fsel('urgency',['URGENT','HIGH','MEDIUM','LOW','DONE'])}
 <button class="btn alt" onclick="F={subject:'All',status:'All',priority:'All',urgency:'All'};render()">Show all</button></div></div>
 <div class="card scroll"><table><tr><th>Assignment</th><th>Subject</th><th>Deadline</th><th>Days remaining</th><th>Status</th><th>Priority</th><th>Urgency</th><th></th></tr>${rows||'<tr><td colspan="8">No assignments match.</td></tr>'}</table></div>`};
function addAssign(){const g=id=>$('#'+id).value.trim(),er=$('#err'),s=g('a_s'),t=g('a_t'),a=g('a_a'),l=g('a_l');
 if(!s)return er.textContent='Please enter a subject name.';if(!t)return er.textContent='Please enter an assignment title.';
 if(!l||isNaN(new Date(l)))return er.textContent='Please choose a valid deadline.';if(a&&l<a)return er.textContent='The deadline cannot be before the assigned date.';
 S.assigns.push({id:Date.now(),subject:s,title:t,desc:g('a_d'),assigned:a||today(),deadline:l,priority:$('#a_p').value,status:$('#a_st').value});save();render()}
function setStatus(id,v){S.assigns.find(a=>a.id===id).status=v;save();render()}
function delAssign(id){S.assigns=S.assigns.filter(a=>a.id!==id);save();render()}

V.prio=()=>{const pr=prios();return `<h1>🎯 Smart Priorities</h1><p class="sub">Highest score first. Every point is shown, so you can explain each ranking.</p>
 <div class="card">${pr.length?pr.map((x,i)=>prioItem(x,i,true)).join(''):'Add marks or assignments to see priorities.'}</div>
 <div class="card"><h2>How the score works</h2><p class="lbl">This is a rule-based system. It does not use AI or machine learning.</p><div class="scroll"><table>
 <tr><th>Rule</th><th>Points</th></tr><tr><td>Subject average below 60% (Focus Required)</td><td>+40</td></tr><tr><td>Subject average 60–79%</td><td>+15</td></tr><tr><td>Subject average 80%+ (Strong)</td><td>+5</td></tr>
 <tr><td>Assignment due today or overdue</td><td>+50</td></tr><tr><td>Assignment due within 2 days</td><td>+40</td></tr><tr><td>Assignment due within 5 days</td><td>+20</td></tr>
 <tr><td>High / Medium assignment priority</td><td>+20 / +10</td></tr><tr><td>Status Pending / In Progress</td><td>+15 / +10</td></tr></table></div></div>`};

V.plan=()=>{const t=today(),done=S.done[t]||{},pr=prios().slice(0,5),slots=['09:00','11:00','14:00','17:00','20:00'];
 const hm=(s,m)=>{const [h,mi]=s.split(':').map(Number),e=h*60+mi+m;return pad(Math.floor(e/60))+':'+pad(e%60)};
 const n=pr.filter(x=>done[x.key]).length,p=pr.length?Math.round(n/pr.length*100):0;
 return `<h1>📅 Study Planner</h1><p class="sub">Today's sessions, built from the priority list. Tick them off as you go.</p>
 <div class="card"><div class="top"><h2>Today · ${t}</h2><b>${n}/${pr.length} done</b></div><div class="bar"><i style="width:${p}%"></i></div></div>
 <div class="card">${pr.map((x,i)=>`<label class="item ${x.l}" style="display:block;cursor:pointer;color:var(--tx);font-size:15px;margin-bottom:10px"><input type="checkbox" style="width:auto;margin-right:8px" ${done[x.key]?'checked':''} onchange="tick('${x.key}')">
 <b>${slots[i]}–${hm(slots[i],x.min)}</b> ${dot(x.l)} ${esc(x.name)}<small>${esc(x.act)} · ${x.min} min</small></label>`).join('')||'Nothing to plan yet.'}</div>`};
function tick(k){const t=today();S.done[t]=S.done[t]||{};S.done[t][k]=!S.done[t][k];save();render()}

V.prog=()=>{const A=S.assigns,tot=A.length,dn=A.filter(a=>a.status==='Completed').length,od=A.filter(a=>a.status!=='Completed'&&daysLeft(a.deadline)<0).length,pend=tot-dn-od,cp=tot?Math.round(dn/tot*100):0;
 const stat=(l,v,c)=>`<div class="card"><div class="lbl">${l}</div><div class="big ${c||''}">${v}</div></div>`;
 const subs=[...new Set(S.marks.map(m=>m.subject))].sort();
 const imp=subs.map(s=>{const L=S.marks.filter(m=>m.subject===s).sort(byDate).map(pct),d=L[L.length-1]-L[0];
  const msg=L.length<2?'Add another test to see your progress.':d>0?`${esc(s)} improved by ${d.toFixed(0)} percentage points. Great work!`:d===0?`${esc(s)} is holding steady.`:`${esc(s)} dipped by ${(-d).toFixed(0)} points — a few focused sessions can bring it back up.`;
  return `<div class="item ${d>0?'g':'y'}"><b>${esc(s)}</b>: ${L.map(v=>v.toFixed(0)+'%').join(' → ')}<small>${msg}</small></div>`}).join('');
 const pr=prios().slice(0,5),dd=S.done[today()]||{},sn=pr.filter(x=>dd[x.key]).length;
 return `<h1>📈 Progress Tracking</h1><p class="sub">Small steps add up.</p>
 <div class="grid"><div class="card"><div class="lbl">Overall average</div><div class="big">${overall().toFixed(1)}%</div></div>${stat('Total assignments',tot)}${stat('Completed',dn,'g')}${stat('Pending',pend)}${stat('Overdue',od,od?'r':'')}</div>
 <div class="two"><div class="card"><h2>Assignment completion: ${cp}%</h2><div class="bar"><i style="width:${cp}%"></i></div></div>
 <div class="card"><h2>Today's study tasks: ${sn}/${pr.length}</h2><div class="bar"><i style="width:${pr.length?sn/pr.length*100:0}%"></i></div></div></div>
 <div class="card"><h2>Subject improvement</h2>${imp||'Add marks to track improvement.'}</div>`};

V.about=()=>`<h1>ℹ️ About StudyPilot</h1><p class="sub">Plan · Learn · Improve</p>
 <p style="margin:-8px 0 16px"><b>Created by a student of BBDU — Devdeep Rajbhar (BCADS13)</b></p>
 <div class="card"><h2>Problem</h2><p>Students often keep marks, assignments and deadlines in different places and may not know what to focus on first.</p><h2>Solution</h2><p>StudyPilot brings academic performance and assignment deadlines into one dashboard and builds a simple, explainable priority list.</p></div>
 <div class="two"><div class="card"><h2>Technologies</h2><p>This browser version: HTML, CSS, JavaScript, data kept in the browser (localStorage). The Streamlit version: Python, Streamlit, Pandas, Matplotlib, CSV files.</p></div>
 <div class="card"><h2>Future scope (not built yet)</h2><p>Mobile app · database · notifications · calendar integration · machine learning · teacher dashboard · multi-student support.</p></div></div>
 <div class="card"><h2>Data</h2><p>Sample data is for demonstration only. Your changes stay in this browser.</p><button class="btn" onclick="if(confirm('Replace everything with sample data?')){S=demoData();save();render()}">Load demo data</button>
 <button class="btn alt" onclick="if(confirm('Delete all marks and assignments?')){S={demo:false,done:{},profile:S.profile,marks:[],assigns:[]};save();render()}">Clear all data</button></div>`;

function go(p){page=p;render();window.scrollTo(0,0)}
function render(){$('#nav').innerHTML=PAGES.map(([k,l])=>`<button class="${k===page?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
 $('#main').innerHTML=(S.demo?'<div class="demo">🧪 <b>Demo mode:</b> you are viewing sample data. Add your own entries, or clear it under About.</div>':'')+V[page]()}
render();
</script></body></html>
